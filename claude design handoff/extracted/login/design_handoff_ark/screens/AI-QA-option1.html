<style>
    * { box-sizing: border-box; }

    @keyframes ark-pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.35; transform: scale(.7); } }
    @keyframes ark-wave { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @keyframes ark-float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(10px,-12px); } }
</style>
</head>
<body>
    <div style="position: relative; width: 392px; height: 812px; border-radius: 56px; padding: 13px; background: linear-gradient(160deg,#23262f,#0c0d12 55%,#1a1c24); box-shadow: 0 0 0 2px #2c2f3a, 0 40px 90px -20px rgba(0,0,0,.85), 0 0 60px -10px rgba(47,244,224,.12);">

            <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(56,230,224,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(56,230,224,.06) 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(180deg, #000, transparent 60%);"></div>

            <!-- user -->
            <div style="display: flex; justify-content: flex-end;">
              <div style="max-width:78%;background:linear-gradient(95deg,#22e6da,#3a8bff);color:#04121f;font-weight:600;border-radius:14px 5px 14px 14px;padding:11px 13px;font-size:13.5px;line-height:1.55;box-shadow:0 0 18px rgba(47,244,224,.3);">客厅主机不制冷是什么原因？</div>
            </div>
            <!-- ai answer (streaming) -->

            </div>
            <!-- user 2 -->
            <div style="display: flex; justify-content: flex-end;">

            </div>
            <!-- thinking -->
            <div style="display: flex; gap: 10px; align-items: flex-start;">

                <span style="width:7px;height:7px;border-radius:50%;background:#2ff4e0;animation:ark-dot 1.2s infinite .3s;"></span>
              </div>
            </div>
          </div>

          <!-- input bar -->
          <div style="position: relative; z-index: 5; flex: 0 0 auto; display: flex; align-items: center; gap: 9px; padding: 9px 14px; background: rgba(8,14,28,.7); border-top: 1px solid rgba(56,230,224,.12);">

            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(170,195,230,.5);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg><span style="font-size:10px;font-family:'Noto Sans SC';">我的</span></div>
          </div>

          <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 30px; background: #000; border-radius: 0 0 20px 20px; z-index: 10;"></div>
