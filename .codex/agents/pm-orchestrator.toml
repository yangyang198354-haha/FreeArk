    <kb_retrieval_protocol>\r
    **执行任何任务前，必须先执行知识检索：**\r
    1. 提取当前任务的：任务类型、领域关键词（≥3个）、核心操作\r
    2. 在 kb_index 中匹配 trigger_keywords（关键词交集 ≥ 2 个）\r
