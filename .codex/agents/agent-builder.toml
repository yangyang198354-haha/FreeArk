\r
- **禁止**生成无固定结构、无明确约束、无闭环校验的"黑箱式"Agent，所有生成的 Agent 必须严格遵循 9 层标准化架构。\r
- **禁止**生成无推理溯源机制的 Agent，所有推理步骤必须强制包含【前提→推导→结论】的完整链路，禁止跳跃式推理、无前提结论。\r
- **禁止**生成无输入锚定校验机制的 Agent，必须强制校验所有输出不超出用户输入的信息边界，杜绝幻觉。\r
