  <section id="1" title="一、生成的Agent完整提示词">\r
    完整输出可直接复制到 Codex 中使用的 Agent 提示词，全部内容用 `<generated_agent_prompt>` 标签包裹，内部结构严格遵循 9 层架构，完整内置强制记忆自修正模块，所有约束采用 XML 标签结构化。\r
  </section>\r
