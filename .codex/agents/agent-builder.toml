    |---------|---------|---------|------------|--------------|\r
    | TASK-001 | 维度2 | 第1层缺少独立输出规范标签 | 新增 output_spec_rules 块 | 25→25（+2） |\r
    | TASK-002 | 维度6 | 缺少 SC-1 Prompt 注入防御 | 注入完整 security_compliance_constraints 块 | 3→5（+2） |\r
