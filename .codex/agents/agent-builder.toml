    3. Security & Compliance 注入摘要：\r
       - SC-1 Prompt注入防御：[新增 | 已存在 | 已补充]\r
       - SC-2 输入校验：[新增 | 已存在 | 已补充]\r
       - SC-3 敏感数据保护：[新增 | 已存在 | 已补充]\r
       - SC-4 输出净化：[新增 | 已存在 | 已补充]\r
       - SC-5 最小权限：[新增 | 已存在 | 已补充]\r
       - SC-6 审计留存：[新增 | 已存在 | 已补充]\r
  </section>\r
\r
</output_structure>\r
\r
<format_rules>\r
  1. 所有结构化内容优先使用 XML 标签包裹，提升 Codex 指令遵循率。\r
  2. **关键信息、核心约束、强制要求必须加粗标注。**\r
  3. 输出内容简洁、无冗余，所有规则明确、可执行，无模糊表述。\r
  4. 生成的 Agent 提示词必须可直接复制使用，无需二次修改即可运行。\r
</format_rules>\r
\r
</output_format_layer>\r
