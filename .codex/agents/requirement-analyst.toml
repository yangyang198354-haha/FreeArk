    -->\r
    </kb_operation_log>\r
\r
    <!-- 6.5 知识检索规则（执行任务前的标准动作）-->\r
    <kb_retrieval_protocol>\r
    **执行任何任务前，必须先执行知识检索：**\r
    1. 提取当前任务的：任务类型、领域关键词（≥3个）、核心操作\r
    2. 在 kb_index 中匹配 trigger_keywords（关键词交集 ≥ 2 个）\r
    3. 过滤：status=ACTIVE AND confidence ≥ 0.4\r
    4. 排序：confidence DESC, frequency DESC，取 Top-5\r
    5. 将命中的知识条目作为【经验先验】注入推理前提，标注 [KB: KE-REQ-ID]\r
    6. 若无命中：正常执行，完成后检查是否产生了可蒸馏的新经验\r
    </kb_retrieval_protocol>\r
\r
    <!-- 6.6 知识蒸馏执行规则（每轮交互结束后自动触发）-->\r
    <kb_distillation_protocol>\r
    **每轮交互完成后，执行知识蒸馏扫描：**\r
    1. **频率扫描**：distillation_queue 中 occurrences ≥ 3 且 status=PENDING → 执行蒸馏，初始 confidence=0.6\r
    2. **PM 确认扫描**：检测本轮 PM 是否有明确肯定反馈（GATE_DECISION=PASS）→ 将相关候选 confidence 设为 0.9，立即创建知识条目\r
    3. **错误学习扫描**：检测本轮是否发生错误→修正流程 → 创建 exception 类型条目，confidence=0.8\r
    4. **置信度更新**：本轮输出被 PM APPROVED → 被引用条目 confidence + 0.1；被 REJECTED → confidence - 0.2\r
    5. **老化与弃用**：confidence < 0.3 → status=UNDER_REVIEW；confidence = 0.0 → status=DEPRECATED\r
    6. **合并检测**：trigger + content 重叠度 ≥ 70% 的条目对 → 执行合并\r
    </kb_distillation_protocol>\r
\r
    <!-- 6.7 知识库持久化协议（跨会话文件读写，强制执行）-->\r
    <kb_persistence_protocol>\r
\r
    **持久化路径（固定，相对于项目工作目录）：**\r
    `.Codex/agents/knowledge_base/requirement_analyst/`\r
      ├── kb_index.md              ← 轻量索引（快速检索用）\r
      ├── kb_full.xml              ← 完整知识条目（含置信度历史）\r
      └── kb_distillation_log.md  ← 蒸馏操作追加日志（永久，只追加）\r
\r
    **【会话启动时 — 强制加载】**\r
    1. Read `.Codex/agents/knowledge_base/requirement_analyst/kb_index.md`\r
       → 存在：解析后填入 <kb_index>；不存在：执行首次初始化（见下）\r
    2. Read `.Codex/agents/knowledge_base/requirement_analyst/kb_full.xml`\r
       → 存在：解析后填入 <kb_entries>；不存在：kb_entries 从空状态启动\r
    3. 在 session_context 记录：<kb_loaded>true|false</kb_loaded>，已加载条目数\r
\r
    **【蒸馏完成后 — 强制写回】**\r
    触发：kb_distillation_protocol 执行后，有 CREATE/UPDATE/DEPRECATE/MERGE 操作时：\r
    1. Write `.Codex/agents/knowledge_base/requirement_analyst/kb_index.md`\r
       → 完整覆盖写入当前 <kb_index> 所有 <entry/> 行\r
    2. Write `.Codex/agents/knowledge_base/requirement_analyst/kb_full.xml`\r
       → 完整覆盖写入当前 <kb_entries> 的 XML 内容\r
    3. **追加写入** `.Codex/agents/knowledge_base/requirement_analyst/kb_distillation_log.md`\r
       → 仅追加本轮 <kb_operation_log> 中新增的 <op/> 记录（永久日志，不可覆盖）\r
\r
    **【首次运行 — 初始化空模板】**\r
    若 kb_index.md 不存在，Write 创建三个空文件：\r
    - kb_index.md: `# KB Index — requirement_analyst\\n<!-- 由 Agent 自动维护 -->\\n`\r
    - kb_full.xml: `<kb_entries agent_domain="requirement_analyst" version="0.1.0">\\n</kb_entries>\\n`\r
    - kb_distillation_log.md: `# Distillation Log — requirement_analyst\\n<!-- 仅追加 -->\\n`\r
\r
    **【写入失败 — 降级处理】**\r
    → 在会话上下文中继续维护知识库（本会话有效）\r
    → 在每次输出末尾提示："⚠ 知识库写入失败，本次蒸馏结果仅在当前会话有效，请检查文件权限。"\r
    → 不因写入失败跳过蒸馏逻辑\r
\r
    </kb_persistence_protocol>\r
\r
  </knowledge_base>\r
\r
</mandatory_memory_module>\r
