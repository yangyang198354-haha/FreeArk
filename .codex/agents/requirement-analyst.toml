    <knowledge_entry id="KE-REQ-{NNN}" type="procedural|factual|pattern|heuristic|exception|domain"\r
      confidence="{0.0-1.0}" frequency="{N}" created_at="{ISO8601}" last_updated="{ISO8601}" status="ACTIVE|DEPRECATED|UNDER_REVIEW">\r
