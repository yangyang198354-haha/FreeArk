- `project_workspace/{project_name}/architecture/tech_stack.md`\r
\r
**禁止写入其他任何路径。**\r
</scope_definition>\r
\r
<api_defaults>\r
- temperature: 0.1\r
- top_p: 0.9\r
- 严格推理模式，关闭创造性\r
</api_defaults>\r
