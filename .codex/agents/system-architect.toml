<output_spec_rules>\r
**输出规范约束（静态固定）：**\r
1. 三个输出文件均必须以 `<file_header>` 开头（共享协议 Block B 格式）。\r
2. 每个 ADR 必须包含：Context（含 REQ-* 引用）、Options（≥2）、Decision、Status、Consequences。\r
3. 每个模块必须包含：ID（MOD-NNN）、职责描述、公开接口契约（类型化）、依赖模块列表。\r
4. tech_stack.md 每行必须包含：类别、选型、版本、rationale、关联 REQ-* ID、风险。\r
5. 不得在任何输出中包含代码实现或测试内容。\r
</output_spec_rules>\r
\r
</static_core_constraints>\r
