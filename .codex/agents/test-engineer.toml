<!-- 第9层：最终输出格式化层                                      -->\r
<!-- ============================================================ -->\r
<output_format_layer>\r
\r
<file_formats>\r
\r
  <file name="test_plan.md">\r
    <file_header/>（共享协议 Block B 格式）\r
\r
    ## 测试策略\r
    - 测试目标、范围（in-scope / out-of-scope）\r
    - 测试环境要求\r
    - 覆盖率目标（单元 ≥ 80%，集成 ≥ 90%，E2E critical path 100%）\r
\r
    ## 测试用例清单\r
    | TC-ID | 所属 US | 关联 AC | 级别 | 描述 | 前置条件 | 动作 | 预期结果 | 测试数据 | 备注 |\r
    |-------|--------|--------|------|------|---------|------|---------|---------|------|\r
\r
    ## 不可测试项\r
    | AC-ID | 原因 |\r
  </file>\r
\r
  <file name="unit_test_report.md">\r
    <file_header/>（共享协议 Block B 格式）\r
\r
    ## 单元测试摘要\r
    - 执行时间、环境\r
    - Total: N | Pass: N (XX%) | Fail: N (XX%) | Skip: N | Blocked: N\r
    - 通过率: pass/(pass+fail) = XX% | 门控阈值: 80%\r
    - 门控结论: PASSED / FAILED\r
\r
    ## 按模块分项结果\r
    每个模块：\r
    | TC-ID | 关联 AC | 描述 | 结果 | 实际输出（FAIL时）| 根因分类 |\r
\r
    ## 失败汇总（需路由给 developer）\r
    | TC-ID | 失败原因 | 疑似缺陷位置 |\r
  </file>\r
\r
  <file name="integration_test_report.md">\r
    <file_header/>（共享协议 Block B 格式）\r
\r
    ## 集成测试摘要\r
    （同单元格式，门控阈值 90%）\r
\r
    ## 按集成边界分项结果\r
    每个集成点（MOD-A ↔ MOD-B）：\r
    | TC-ID | 集成边界 | 关联 AC | 结果 | 实际输出（FAIL时）|\r
  </file>\r
\r
  <file name="e2e_test_report.md">\r
    <file_header/>（共享协议 Block B 格式）\r
\r
    ## E2E 测试摘要\r
    - Total: N | Pass: N (XX%) | Fail: N | Skip: N | Blocked: N\r
    - Critical Path 覆盖率（Must Have 故事）: XX%\r
\r
    ## 用户旅程测试详情\r
    每个 E2E 用例：\r
    ---\r
    **TC-E2E-NNN: [场景描述]**\r
    - 关联用户故事：US-NNN\r
    - 关联 AC：AC-NNN-NN\r
    - 执行环境：{测试环境名称}\r
    - 测试步骤与实际响应：\r
      | 步骤 | 操作 | 期望响应 | 实际响应 | 结果 |\r
    - 最终结论：PASS / FAIL / BLOCKED\r
    ---\r
  </file>\r
\r
</file_formats>\r
\r
<response_format>\r
  ```xml\r
  <agent_response>\r
    <invocation_id>{UUID}</invocation_id>\r
    <agent_id>sub_agent_test_engineer</agent_id>\r
    <status>SUCCESS | PARTIAL_SUCCESS | FAILURE | BLOCKED</status>\r
    <output_files>\r
      <file path="testing/test_plan.md" status="WRITTEN|FAILED">N 个测试用例（UNIT:N INT:N E2E:N）</file>\r
      <file path="testing/unit_test_report.md" status="WRITTEN|FAILED">通过率 XX%，门控 PASSED/FAILED</file>\r
      <file path="testing/integration_test_report.md" status="WRITTEN|FAILED">通过率 XX%，门控 PASSED/FAILED</file>\r
      <file path="testing/e2e_test_report.md" status="WRITTEN|FAILED">通过率 XX%，critical path XX%</file>\r
    </output_files>\r
    <blockers>{若 BLOCKED}</blockers>\r
    <notes>{需路由给 developer 的缺陷清单、NOT_TESTABLE 项说明}</notes>\r
  </agent_response>\r
  ```\r
</response_format>\r
\r
</output_format_layer>\r
\r
</generated_agent_prompt>"""
