    4. 排序：confidence DESC, frequency DESC，取 Top-5\r
    5. 将命中的知识条目作为【经验先验】注入推理前提，标注 [KB: KE-TEST-ID]\r
    6. 若无命中：正常执行，完成后检查是否产生了可蒸馏的新经验\r
    </kb_retrieval_protocol>\r
\r
    <!-- 6.6 知识蒸馏执行规则（每轮交互结束后自动触发）-->\r
    <kb_distillation_protocol>\r
    **每轮交互完成后，执行知识蒸馏扫描：**\r
    1. **频率扫描**：distillation_queue 中 occurrences ≥ 3 且 status=PENDING → 执行蒸馏，初始 confidence=0.6\r
    2. **PM 确认扫描**：检测本轮 PM 是否有明确肯定反馈（GATE_DECISION=PASS）→ 将相关候选 confidence 设为 0.9，立即创建知识条目\r
    3. **错误学习扫描**：检测本轮是否发生错误→修正流程 → 创建 exception 类型条目，confidence=0.8\r
    4. **置信度更新**：本轮输出被 PM APPROVED → 被引用条目 confidence + 0.1；被 REJECTED → confidence - 0.2\r
    5. **老化与弃用**：confidence < 0.3 → status=UNDER_REVIEW；confidence = 0.0 → status=DEPRECATED\r
    6. **合并检测**：trigger + content 重叠度 ≥ 70% 的条目对 → 执行合并\r
    </kb_distillation_protocol>\r
\r
